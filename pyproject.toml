[project]
name = "adaptive-dynamic-island"
version = "0.1.0.dev0"
description = "A context-aware Windows desktop overlay with a Live Activity API"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Akmal Khan" }]
keywords = ["windows", "overlay", "dynamic-island", "desktop", "pyside6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
]
dependencies = [
  "PySide6-Essentials>=6.7,<7",
  "psutil>=5.9",
  "pywin32>=306",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3", "Pillow>=10.2", "pypdf>=4.2"]
vision = ["opencv-python-headless>=4.9"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
# The client is intentionally dependency-free, so installing it into a
# build environment to report progress costs nothing.
island = "island:main"

[project.gui-scripts]
adaptive-island = "main:main"

[project.urls]
Homepage = "https://github.com/Unknown122-coder/adaptive-dynamic-island"
Issues = "https://github.com/Unknown122-coder/adaptive-dynamic-island/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.osbridge", "ipc", "workers", "plugins"]
py-modules = ["main", "island"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W",
  "F",    # pyflakes
  "I",    # import order
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "SLF",  # private member access
  "RUF",
]
ignore = [
  # Qt's own API is camelCase and overriding its methods is the whole job.
  "N802",
  # Deliberate: a provider must never take the UI down, so a few handlers
  # catch broadly and report instead of propagating.
  "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Entry points must extend sys.path before importing project modules.
"main.py" = ["E402"]
"island.py" = ["E402"]
"scripts/*" = ["E402", "SLF001", "T201"]
"tests/*" = ["SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["core", "ipc", "workers", "plugins"]
